  if (p.status === 'kept') return '<span class="stamp kept">kept</span>';
  if (p.status === 'capsized') return '<span class="stamp capsized">capsized</span>';
  if (p.status === 'active') return g.at === p.id ? '<span class="stamp go">turn</span>' : '<span class="stamp active">fishing</span>';
  return '';
}
function bigCard(g, card, line){
  const t = g.T(card);
  const out = line && line.outcome ? line.outcome : '';
  const good = ['caught','kept','stolen','saved','swapped','used'].includes(out), meh = ['cut','passed','got away','no effect','not used'].includes(out);
  return `<div class="card scrap ${t.kind}${line && line.done ? ' done' : ''}" style="--tilt:${tilt(card.uid)}deg">
    <span class="tape"></span><span class="kind-tag">${t.kind === 'item' ? 'item' : 'fish'}</span><span class="count-tag">${t.count} in deck</span>
    <div class="card-art">${art(t)}</div>
    <div class="card-name">${esc(t.name)}</div>
    ${t.kind === 'fish' ? `<div class="card-stats"><span class="catchv">${t.rolls} roll${t.rolls > 1 ? 's' : ''}<br>need ${t.target}+${t.raw ? '<br>no bonuses' : ''}</span><span class="pts">${t.points}<small>PTS</small></span></div>` : ''}
    ${cardText(t, g.S) ? `<p class="card-text">${esc(cardText(t, g.S))}</p>` : ''}
    ${out ? `<span class="overstamp${good ? ' good' : meh ? ' meh' : ''}">${esc(out)}</span>` : ''}
  </div>`;
}
function miniCard(g, c){
  const t = g.T(c);
  return `<div class="mcard scrap ${t.kind}" style="--tilt:${tilt(c.uid)}deg" title="${esc(cardText(t, g.S))}">
    <div class="m-art">${art(t)}</div><div class="m-name">${esc(t.name)}</div>
    ${t.kind === 'fish' ? `<span class="m-pts">${t.points}</span>` : ''}${t.bonus ? `<span class="m-bonus">${t.bonus > 0 ? '+' : ''}${t.bonus}</span>` : ''}
  </div>`;
}
function dieHTML(d){
  const cls = d.rolling ? 'rolling' : (d.ok ? 'ok' : 'no') + (d.r === 20 ? ' nat20' : d.r === 1 ? ' nat1' : '');
  const sum = d.rolling ? '&nbsp;' : (d.b ? `${d.r} ${d.b > 0 ? '+' : '−'} ${Math.abs(d.b)} = <b>${d.total}</b>` : `<b>${d.total}</b>`) + `<br>${d.ok ? 'caught' : 'need ' + d.need}`;
  return `<div class="die ${cls}${d.tag === 'spare' ? ' spare' : ''}" style="--td:${d.td || 600}ms"><div class="gem">${D20}<span class="num">${d.rolling ? '?' : d.r}</span></div><div class="sum">${sum}</div></div>`;
}
// the 1-20 strip: which faces of the die catch this fish, and where each roll landed
function zoneOf(g, L){
  const t = g.T(L.card), holder = g.players[L.holder];
  if (L.zone) return L.zone;
  const b = t.raw ? 0 : g.bonus(holder) + (L.accum || 0);
  return { from: t.raw ? t.target : t.target - b, b };
}
function stripHTML(g, L){
  const t = g.T(L.card), z = zoneOf(g, L);
  let cells = '';
  for (let n = 1; n <= 20; n++) cells += `<span class="${n >= z.from ? 'z' : ''}">${n}</span>`;
  const marks = L.dice.filter(d => !d.rolling).map(d => `<i class="mk ${d.ok ? 'ok' : 'no'}" style="left:${(d.r - .5) / 20 * 100}%">${d.r}</i>`).join('');
  const bonus = z.b ? ` (need ${t.target}, ${z.b > 0 ? '+' : '−'}${Math.abs(z.b)} bonus)` : t.raw ? ' (bonuses don’t count)' : '';
  const label = z.from <= 1 ? 'Any roll catches it' : z.from > 20 ? `No roll can catch it: needs ${t.target}` : `Catch zone: ${z.from} or more on the die${bonus}`;
  return `<div class="strip">${cells}${marks}</div><div class="strip-l">${label}</div>`;
}
const THROW_BTN = (a, label) => `<button class="btn fish big throw" data-a="${a}"><span class="tl">${label}</span><small>hold to shake</small><kbd>R</kbd></button>`;

function promptHTML(g, pd){
  const body = promptBody(g, pd);
  return isYou(g, pd.p) || !g.players.some(q => q.human && q !== pd.p && !q.remote) ? body : `<p class="asker">${esc(pd.p.name)}, this one’s yours.</p>` + body;
}
function promptBody(g, pd){
  const { kind, data: d, p } = pd;
  switch (kind){
    case 'turn': {
      const b = g.boatPts(p), tp = g.tankPts(p);
      return `<p class="q">Fish (draw a card) or keep (move your boat into your tank and sit out the rest of the round)?</p>
        <button class="btn fish big" data-a="fish">Fish <kbd>F</kbd></button>
        <button class="btn keep big" data-a="keep">Keep <kbd>K</kbd></button>
        <p class="hint">Boat ${P(b)} · Tank ${tp} / ${g.S.winPoints}${tp + b >= g.S.winPoints ? ` · Keeping now takes you to ${tp + b}, enough to win if no one beats it this round.` : ''}</p>`;
    }
    case 'preRoll': {
      const lead = d.note === 'slipped' ? `${esc(d.t.name)} was passed to you. You must roll for it.`
        : d.note === 'joker' ? `${esc(d.t.name)} was passed to you, with +${d.accum} added to your roll.`
        : `${esc(d.t.name)}: ${rollsText(d.t)}.`;
      return `<p class="q">${lead} Chance to catch: <b>${pct(d.chance)}</b>.</p>
        ${THROW_BTN('roll', d.t.rolls > 1 ? `Roll 1 of ${d.t.rolls}` : 'Roll')}
        ${d.canCut ? `<button class="btn cut" data-a="cut">Use Scissors: discard it and keep <kbd>C</kbd></button>` : ''}`;
    }
    case 'throw': {
      const lead = d.tag === 'spare' ? `Spare Line roll ${d.i + 1} of ${d.n}` : d.n > 1 ? `Roll ${d.i + 1} of ${d.n}` : 'Roll';
      return `<p class="q">${esc(d.t.name)}: ${d.i === 0 ? rollsText(d.t) : 'missed so far'}. Chance to catch: <b>${pct(1 - Math.pow(1 - Math.min(1, Math.max(0, (21 - Math.max(1, d.t.raw ? d.t.target : d.t.target - d.b)) / 20)), d.n - d.i))}</b>.</p>${THROW_BTN('throw', lead)}`;
    }
    case 'spare':
      return `<p class="q">Missed. Use a Spare Line for ${g.S.spareReroll === 'all' ? 'another set of rolls' : 'one more roll'}? Chance: <b>${pct(d.chance)}</b>.</p>
        ${THROW_BTN('yes', 'Use Spare Line')}<button class="btn" data-a="no">No, capsize <kbd>N</kbd></button>`;
    case 'target':
      return `<p class="q">${d.why === 'rock' ? 'Rock: choose a player to capsize.' : 'Bargain: choose a player to swap boats with.'}</p><div class="choices">` +
        d.ids.map(id => { const q = g.players[id]; return `<button class="btn choice" data-a="t:${id}">${esc(q.name)}<small>boat: ${P(g.boatPts(q))}, ${q.boat.length} fish</small></button>`; }).join('') + '</div>';
    case 'plankdum':
      return `<p class="q">${esc(d.t.name)}: choose a fish to swap it for.</p><div class="choices">` +
        d.opts.map(o => { const q = g.players[o.pid], c = q && q.boat.find(x => x.uid === o.uid); if (!c) return ''; const t = g.T(c); return `<button class="btn choice" data-a="p:${o.pid}:${o.uid}">${esc(t.name)}<small>${P(t.points)}, ${esc(q.name)}'s boat</small></button>`; }).join('') + '</div>';
    case 'crook': {
      const seen = new Set(), btns = [];
      for (const o of d.opts){
        const q = g.players[o.pid], c = q && q.tank.find(x => x.uid === o.uid); if (!c) continue;
        const t = g.T(c), k = o.pid + ':' + c.t;
        if (seen.has(k)) continue; seen.add(k);
        btns.push(`<button class="btn choice" data-a="c:${o.pid}:${o.uid}">${esc(t.name)}<small>${P(t.points)}, ${esc(q.name)}'s tank · ${pct(g.chance(p, t))} to catch</small></button>`);
      }
      return `<p class="q">${esc(d.t.name)}: choose a fish from another tank to roll for. ${g.S.crookFail === 'capsize' ? 'If you miss, you capsize.' : 'Missing costs nothing.'}</p><button class="btn" data-a="none">Don't use it</button><div class="choices">${btns.join('')}</div>`;
    }
  }
  return '';
}

const UI = {
  game: null, pending: null, focus: null,
  ask(g, p, kind, data){
    if (p.remote && NET.role === 'host') return NET.askRemote(g, p, kind, data);
    return new Promise(res => { this.pending = { g, p, kind, data, res }; this.focus = p.id; if (kind === 'turn') SFX.play('yourturn'); this.render(g); focusPrompt(); });
  },
  fx(g, name, d){
    if (g !== this.game) return;
    playFx(name, d);
    if (NET.role === 'host') NET.queueFx(name, d);
  },
  answer(v){ const pd = this.pending; if (!pd) return; this.pending = null; setHTML($('#prompt'), ''); pd.res(v); },
  render(g){ if (g === this.game){ renderAll(g); if (NET.role === 'host') NET.markDirty(); } },
};
// sounds + screen effects for one game event (also replayed on online guests' screens)
function playFx(name, d = {}){
  SFX.play(name, d);
  if (name === 'draw' && d.item) SFX.play('item');
  switch (name){
    case 'capsize': shake('l'); splashAt(seatArt(d.pid), 18, 'sea', .6, .72); break;
    case 'saved': splashAt(seatArt(d.pid), 8, 'sea', .6, .72); break;
    case 'caught': splashAt($('#pondCard .card'), 12, 'slime', .5, .35); break;
    case 'keep': popSeat(d.pid); if (d.n) splashAt(seatArt(d.pid), Math.min(4 + d.n * 2, 14), 'gold', .1, .62); break;
    case 'rock': shake('s'); break;
    case 'chomp': case 'steal': popSeat(d.pid); break;
    case 'land': if (d.nat === 20) shake('s'); break;
    case 'diabolical': speak('aiya diabolical'); bubbleAt(seatArt(d.pid), 'aiya diabolical', 'aiya'); shake('s'); break;
  }
}
// which seat sits at the bottom of the screen: you, or (same device) whoever is deciding
function meId(g){
  if (NET.role === 'client') return NET.seat >= 0 ? NET.seat : 0;
  const local = p => p && p.human && !p.remote;
  if (UI.pending && UI.pending.g === g && local(UI.pending.p)) return UI.pending.p.id;
  if (UI.focus != null && local(g.players[UI.focus])) return UI.focus;
  const h = g.players.find(local); return h ? h.id : 0;
}
// is this seat the person looking at the screen (for "your turn" wording)?
function isYou(g, p){ return NET.role === 'client' ? p.id === NET.seat : !!p.you; }
function focusPrompt(){ const b = $('#prompt .btn'); if (b && $('#overlay').hidden) try { b.focus({ preventScroll: true }); } catch(e){} }

const SEAT = `<div class="turn-flag" hidden><span></span>${ARROW}</div>
  <div class="boat-art"></div>
  <div class="tag scrap news">
    <div class="tag-h"><span class="seatno"></span><span class="pname"></span><span class="st"></span></div>
    <div class="tline"><span class="zl">Tank</span><span class="n tt"></span><span class="of tw"></span><span class="tnote"></span></div>
    <div class="tmeter"></div>
    <div class="tlist"></div>
    <div class="bline"><span class="zl bl"></span><span class="bchips"></span></div>
  </div>`;

function renderSeat(g, p, el){
  const S = g.S;
  const cur = g.at === p.id && !g.winner;
  const holder = !cur && g.line && !g.line.done && g.line.holder === p.id;
  const you = isYou(g, p);
  el.className = `seat-b st-${p.status}${p.id === meId(g) ? ' me' : ''}${cur ? ' cur' : ''}${holder ? ' holder' : ''}`;
  const flag = el.querySelector('.turn-flag');
  flag.hidden = !(cur || holder);
  flag.querySelector('span').textContent = holder ? (you ? 'your roll' : 'rolling') : (you ? 'your turn' : `${p.name}'s turn`);
  setHTML(el.querySelector('.boat-art'), boatSVG(g, p));
  setHTML(el.querySelector('.seatno'), String(p.id + 1));
  setHTML(el.querySelector('.pname'), esc(p.name) + (p.remote ? ` <span class="online${netOff(p) ? ' off' : ''}">${netOff(p) ? 'offline' : 'online'}</span>` : ''));
  setHTML(el.querySelector('.st'), stampHTML(g, p));
  const tp = g.tankPts(p), bp = g.boatPts(p), bonus = g.bonus(p);
  setHTML(el.querySelector('.tt'), String(tp));
  setHTML(el.querySelector('.tw'), `/ ${S.winPoints}`);
  setHTML(el.querySelector('.tnote'), p.note ? `<span class="tn ${p.note.delta >= 0 ? 'up' : 'down'}" data-n="${p.note.id}">${p.note.delta >= 0 ? '+' : '−'}${Math.abs(p.note.delta)} ${esc(p.note.why)}</span>` : '');
  setHTML(el.querySelector('.tmeter'), meter(tp, S.winPoints));
  const tl = el.querySelector('.tlist'), tt = tankText(g, p.tank);
  setHTML(tl, esc(tt || 'tank empty')); tl.title = tt;
  setHTML(el.querySelector('.bl'), p.status === 'capsized' ? 'Boat: sunk, out this round' : p.status === 'kept' ? 'Boat: kept, out this round' : `Boat: ${P(bp)}${bonus ? ` · ${bonus > 0 ? '+' : ''}${bonus} to rolls` : ''}`);
  setHTML(el.querySelector('.bchips'), p.boat.map(c => chip(g, c)).join('') + p.items.map(c => chip(g, c)).join(''));
}

function renderAll(g){
  const mid = meId(g), you = g.players[mid], S = g.S, key = k => g.serial + ':' + k;
  const pd = UI.pending && UI.pending.g === g ? UI.pending : null;
  setHTML($('#status'), `Round ${g.round || 1}<span>first to ${S.winPoints} points wins${NET.code && NET.role ? ` · online table ${esc(NET.code)}` : ''}</span>`);

  // boats: the bottom seat is you (or whoever is deciding on this device); the rest sail along the top
  const opps = $('#opps'), me = $('#meSeat');
  if (opps.dataset.serial !== String(g.serial)){ opps.innerHTML = ''; me.innerHTML = ''; opps.dataset.serial = g.serial; }
  for (const p of g.players){
    const box = p.id === mid ? me : opps;
    let el = document.querySelector(`#opps > [data-pid="${p.id}"], #meSeat > [data-pid="${p.id}"]`);
    if (!el){ el = document.createElement('article'); el.dataset.pid = p.id; el.innerHTML = SEAT; el.setAttribute('aria-label', p.name); }
    if (el.parentNode !== box) box.appendChild(el);
    renderSeat(g, p, el);
  }
  const order = g.players.filter(p => p.id !== mid).map(p => String(p.id));
  if ([...opps.children].map(e => e.dataset.pid).join() !== order.join()) order.forEach(id => opps.appendChild(opps.querySelector(`[data-pid="${id}"]`)));

  // deck, current card, turn note
  setHTML($('#deckpile'), `<div class="cb scrap" style="--r:-7deg"></div><div class="cb scrap" style="--r:4deg"></div><div class="cb scrap" style="--r:-1deg">${CARDBACK}</div><div class="dp-l">deck <b>${g.deck.length}</b><br>discard <b>${g.discard.length}</b></div>`);
  const L = g.line;
  syncKeyed($('#pondCard'), L ? [{ k: key('L' + L.id), html: bigCard(g, L.card, L) }] : [{ k: 'slot', html: `<div class="card-slot">drawn cards<br>show here</div>` }]);
  const tape = $('#noteTape');
  tape.hidden = !pd;
  if (pd) tape.textContent = isYou(g, pd.p) ? (g.at !== pd.p.id ? 'your roll' : 'your turn') : `${pd.p.name}: ${g.at !== pd.p.id ? 'roll' : 'turn'}`;
  setHTML($('#noteMeta'), `round ${g.round || 1} · deck ${g.deck.length} · discard ${g.discard.length}`);
  const st = g.story;
  setHTML($('#storyT'), st ? esc(st.title) : '');
  const storyEl = $('#story'), nLines = storyEl.children.length;
  syncKeyed(storyEl, st ? st.lines.map((l, i) => ({ k: key(`s${st.id}-${i}`), html: `<li class="${l.kind}">${l.text}</li>` })) : []);
  if (storyEl.children.length !== nLines) storyEl.scrollTop = storyEl.scrollHeight;
  const showTray = !!(L && g.T(L.card).kind === 'fish');   // stays up (faded) until the next card is drawn
  if (!THROW.active){ $('#tray').hidden = !showTray; $('#tray').classList.toggle('done', !!(L && L.done)); }
  setHTML($('#strip'), showTray ? stripHTML(g, L) : '');
  if (!THROW.active) syncKeyed($('#dice'), showTray ? L.dice.map((d, i) => ({ k: key(`${L.id}-${i}-${d.rolling ? 'r' : 's'}`), html: dieHTML(d) })) : []);
  let ph;
  if (pd) ph = promptHTML(g, pd);
  else if (g.winner) ph = `<button class="btn keep" data-cmd="again">New game</button>`;
  else if (NET.role === 'host' && NET.pend){ const q = g.players[NET.pend.seat], off = !NET.links[NET.pend.uid]; ph = `<p class="wait">Waiting for ${esc(q.name)} (${off ? 'disconnected' : 'online'})…</p><button class="btn sm takeover${off ? ' now' : ''}" data-cmd="botTakeover">Let a bot play for ${esc(q.name)}</button>`; }
  else if (NET.role === 'client' && g.view && g.pendSeat >= 0 && g.pendSeat !== NET.seat) ph = `<p class="wait">Waiting for ${esc(g.players[g.pendSeat].name)}…</p>`;
  else if (g.at >= 0 && (!g.players[g.at].human || g.players[g.at].remote || (NET.role === 'client' && g.at !== NET.seat))) ph = `<p class="wait">Waiting for ${esc(g.players[g.at].name)}…</p>`;
  else ph = '';
  setHTML($('#prompt'), ph);

  // your cards
  const sp = $('#speedSel'); sp.disabled = NET.role === 'client'; sp.title = NET.role === 'client' ? 'The host sets the bot speed' : '';
  const yb = g.bonus(you);
  setHTML($('#handTitle'), isYou(g, you) || (you.human && !g.players.some(q => q.human && q !== you)) ? 'Your boat' : `${esc(you.name)}’s boat`);
  setHTML($('#youWorth'), `boat <b>${g.boatPts(you)}</b> pts &middot; tank <b>${g.tankPts(you)}</b> / ${S.winPoints}${yb ? ` &middot; ${yb > 0 ? '+' : ''}${yb} to your rolls` : ''}`);
  syncKeyed($('#boat'), you.boat.length ? you.boat.map(c => ({ k: key(c.uid), html: miniCard(g, c) })) :
    [{ k: 'empty-' + you.status, html: `<span class="nil">${you.status === 'capsized' ? 'Capsized. The boat sank. Out until next round.' : you.status === 'kept' ? 'Kept. The fish are in the tank. Out until next round.' : 'Empty.'}</span>` }]);
  syncKeyed($('#items'), you.items.length ? you.items.map(c => ({ k: key(c.uid), html: miniCard(g, c) })) : [{ k: 'none', html: '<span class="nil">None.</span>' }]);

  // log: newest turn first, lines inside each turn in the order they happened
  const groups = [];
  for (let i = g.logs.length - 1; i >= 0; i--){
    const l = g.logs[i];
    if (l.kind === 'turn' || l.kind === 'round' || !groups.length) groups.push([]);
    groups[groups.length - 1].push(l);
  }
  const ordered = []; for (let i = groups.length - 1; i >= 0; i--) ordered.push(...groups[i]);
  syncKeyed($('#log'), ordered.map(l => ({ k: key('g' + l.id), html: `<li class="${l.kind}">${l.text}</li>` })));
}

/* rolling dice flicker */
setInterval(() => { document.querySelectorAll('.die.rolling .num').forEach(el => { el.textContent = d20(); }); }, 70);

/* ════════════════════════════ sound (all synthesised, no files) ════════════════════════════ */
const RND = (a, b) => a + Math.random() * (b - a);
function crunchCurve(k){ const n = 1024, c = new Float32Array(n); for (let i = 0; i < n; i++){ const x = i * 2 / n - 1; c[i] = (1 + k) * x / (1 + k * Math.abs(x)); } return c; }
const SFX = {
  ctx: null, out: null, crunch: null, noiseBuf: null, last: {},
  on: (() => { const v = store.get('fishqueen.sound'); return v === null ? true : !!v; })(),
  init(){
    if (!this.on) return;
    try {
      if (!this.ctx){
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        const c = this.ctx = new AC();
        const comp = c.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 5; comp.connect(c.destination);
        this.out = c.createGain(); this.out.gain.value = .7; this.out.connect(comp);
        const ws = c.createWaveShaper(); ws.curve = crunchCurve(28); ws.oversample = '2x';
        const wg = c.createGain(); wg.gain.value = .45; ws.connect(wg); wg.connect(this.out); this.crunch = ws;
        const buf = c.createBuffer(1, c.sampleRate, c.sampleRate), ch = buf.getChannelData(0);
        for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
        this.noiseBuf = buf;
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch(e){ this.ctx = null; }
  },
  ready(){ return this.on && this.ctx && this.ctx.state === 'running'; },
  env(g, t, a, peak, dur){ g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); },
  tone({ type = 'sine', f0 = 440, f1 = 0, dur = .2, gain = .2, a = .005, t = 0, crunch = false }){
    const c = this.ctx, now = c.currentTime + t, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, now); if (f1) o.frequency.exponentialRampToValueAtTime(f1, now + dur);
    this.env(g, now, a, gain, dur); o.connect(g); g.connect(crunch ? this.crunch : this.out); o.start(now); o.stop(now + dur + .05);
  },
  noise({ type = 'bandpass', f0 = 1000, f1 = 0, q = 1, dur = .2, gain = .2, a = .003, t = 0, crunch = false }){
    const c = this.ctx, now = c.currentTime + t, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = this.noiseBuf; src.loop = true; f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, now); if (f1) f.frequency.exponentialRampToValueAtTime(f1, now + dur);
    this.env(g, now, a, gain, dur); src.connect(f); f.connect(g); g.connect(crunch ? this.crunch : this.out);
    src.start(now, Math.random() * .5); src.stop(now + dur + .05);
  },
  play(name, d = {}){
    if (!this.ready() || !SOUNDS[name]) return;
    const now = performance.now();
    if (name !== 'rattle' && this.last[name] && now - this.last[name] < 70) return;   // don't stack identical sounds
    this.last[name] = now;
    try { SOUNDS[name](this, d); } catch(e){}
  },
};
const SOUNDS = {
  ui(s){ s.tone({ type: 'square', f0: 1300, f1: 800, dur: .045, gain: .05 }); },

/* ════════════════════════════ hold to shake, release to throw ════════════════════════════ */
// Purely for feel: how long you shake has no effect on the roll.
const THROW = { active: null };
function startShake(b){
  const pd = UI.pending;
  if (THROW.active && THROW.active.pd !== pd){ clearTimeout(THROW.active.timer); THROW.active.held.remove(); THROW.active = null; }
  if (THROW.active || !pd || !b) return;
  SFX.init();
  const held = toEl(`<div class="die held"><div class="gem">${D20}<span class="num">?</span></div><div class="sum">shaking…</div></div>`);
  $('#tray').hidden = false; $('#dice').appendChild(held);
  b.classList.add('holding'); const tl = b.querySelector('.tl'); if (tl) tl.textContent = 'Release to throw!';
  const st = { b, held, pd, t0: performance.now(), timer: 0 };
  THROW.active = st;
  const tick = () => {
    if (THROW.active !== st) return;
    if (performance.now() - st.t0 > 5000){ releaseShake(); return; }
    const k = Math.min(1, (performance.now() - st.t0) / 1300);
    SFX.play('rattle', { k });
    held.style.setProperty('--k', k.toFixed(2));
    held.querySelector('.num').textContent = d20();
    st.timer = setTimeout(tick, RND(45, 85) - k * 18);
  };
  tick();
}
function releaseShake(){
  const st = THROW.active; if (!st) return;
  const go = () => {
    clearTimeout(st.timer); THROW.active = null; st.held.remove();
    if (UI.pending === st.pd) UI.answer(st.pd.kind === 'spare' ? true : st.b.dataset.a);
  };
  const held = performance.now() - st.t0;
  if (held < 220) setTimeout(go, 220 - held); else go();   // a quick tap still gets a little rattle
}
document.addEventListener('pointerdown', e => {

  e.preventDefault();

/* ════════════════════════════ fit the stage to the window ════════════════════════════ */
// Wide windows get the landscape layout; narrow/portrait ones get the tall layout.
// The stage keeps a fixed logical size and is scaled, so nothing needs page scrolling.
function fit(){
  const vp = $('#viewport'), st = $('#stage');
  const aw = vp.clientWidth, ah = vp.clientHeight; if (!aw || !ah) return;
  const aspect = aw / ah;
  const bots = UI.game ? UI.game.players.length - 1 : clamp(CFG.S.bots, 1, 5, 3);
  let W, H, mode;
  if (aspect >= 1.2){ mode = 'wide'; H = 860; W = Math.round(Math.min(1860, Math.max(1320, H * aspect))); }
  else { mode = 'tall'; H = bots <= 3 ? 1110 : 1370; W = Math.round(Math.min(900, Math.max(560, H * aspect))); }
  const s = Math.min(aw / W, ah / H);
  st.classList.toggle('wide', mode === 'wide'); st.classList.toggle('tall', mode === 'tall');
  st.style.width = W + 'px'; st.style.height = H + 'px';
  st.style.transform = `scale(${s})`;
  st.style.left = Math.max(0, Math.round((aw - W * s) / 2)) + 'px';
  st.style.top = Math.max(0, Math.round((ah - H * s) / 2)) + 'px';
}
if (window.ResizeObserver) new ResizeObserver(() => fit()).observe($('#viewport'));
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', () => setTimeout(fit, 200));

/* ════════════════════════════ online play ════════════════════════════ */
// One person hosts: their browser runs the game. Everyone's messages travel
// through public relay servers (MQTT brokers run by different organisations).
// The game uses every relay it can reach at the same time, so if one is down
// or blocked the others carry on. Messages are encrypted with a key made from
// the table code, and the relays don't store anything. Nothing here changes
// the rules.
const ONLINE = {
  // Relay servers, all used at once. Any MQTT broker that accepts secure
  // WebSocket connections will do; add or remove lines freely.
  relays: [
    'wss://broker.emqx.io:8084/mqtt',
    'wss://broker.hivemq.com:8884/mqtt',
    'wss://mqtt.eclipseprojects.io:443/mqtt',
    'wss://test.mosquitto.org:8081/mqtt',
  ],
  // Change this to keep your copy's tables separate from other copies of the game.
  room: 'gofursh-v3',
};
const PROTO = 3;   // change this when the messages below change, so old and new copies don't mix
const IN_CLAUDE = !!(window.claude && typeof window.claude.use === 'function');
const N0 = (v, d = 0) => Number.isFinite(+v) ? +v : d;
const cleanName = v => String(v || '').replace(/[\u0000-\u001f]/g, '').trim().slice(0, 18) || 'Player';
const cleanId = v => String(v || '').replace(/[^a-z0-9]/g, '').slice(0, 24);
const rid = () => Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);
function toast(msg){ const t = document.createElement('div'); t.className = 'toast scrap note'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 5200); }

/* ---- a tiny MQTT 3.1.1 client over WebSocket: connect, subscribe, publish (QoS 0), keep-alive ---- */
const MQ = {
  te: new TextEncoder(), td: new TextDecoder(),
  str(s){ const b = MQ.te.encode(s), o = new Uint8Array(b.length + 2); o[0] = b.length >> 8; o[1] = b.length & 255; o.set(b, 2); return o; },
  len(n){ const o = []; do { let d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; o.push(d); } while (n > 0); return o; },
  pack(first, ...parts){
    const n = parts.reduce((s, p) => s + p.length, 0), h = MQ.len(n), o = new Uint8Array(1 + h.length + n);
    o[0] = first; o.set(h, 1); let k = 1 + h.length;
    for (const p of parts){ o.set(p, k); k += p.length; }
    return o;
  },
};
class Relay {
  constructor(url, onMsg, onChange){
    Object.assign(this, { url, onMsg, onChange, ws: null, up: false, subs: [], buf: new Uint8Array(0), tries: 0, closed: false, pid: 1, retryT: 0, pingT: 0 });
    this.host = (url.match(/^wss?:\/\/([^/:]+)/) || [])[1] || url;
    this.connect();
  }
  connect(){
    if (this.closed) return;
    clearTimeout(this.retryT);
    let ws;
    try { ws = new WebSocket(this.url, 'mqtt'); } catch(e){ this.retry(); return; }
    ws.binaryType = 'arraybuffer';
    this.ws = ws; this.buf = new Uint8Array(0);
    const guard = setTimeout(() => { if (this.ws === ws && !this.up) try { ws.close(); } catch(e){} }, 9000);
    ws.onopen = () => {
      const id = MQ.str('gf' + rid() + Date.now().toString(36).slice(-6));   // short and plain, as older brokers expect
      this.raw(MQ.pack(0x10, MQ.str('MQTT'), Uint8Array.of(4, 0x02, 0, 60), id));   // MQTT 3.1.1, clean session, 60 s keep-alive
    };
    ws.onmessage = e => { if (this.ws === ws && e.data instanceof ArrayBuffer) this.feed(new Uint8Array(e.data)); };
    ws.onclose = ws.onerror = () => {
      clearTimeout(guard);
      if (this.ws !== ws) return;
      this.ws = null; clearInterval(this.pingT);
      const was = this.up; this.up = false;
      if (was) this.onChange();
      this.retry();
    };
  }
  retry(){
    if (this.closed) return;
    clearTimeout(this.retryT);
    this.retryT = setTimeout(() => this.connect(), Math.min(30000, 1500 * Math.pow(2, Math.min(this.tries++, 5))));
  }
  // try again straight away (the page came back into view, or the network came back)
  nudge(){ if (!this.closed && !this.ws){ this.tries = 0; this.connect(); } }
  close(){
    this.closed = true; clearTimeout(this.retryT); clearInterval(this.pingT);
    const ws = this.ws; this.ws = null; this.up = false;
    if (ws) try { if (ws.readyState === 1) ws.send(Uint8Array.of(0xe0, 0)); ws.close(); } catch(e){}
  }
  raw(bytes){ try { if (this.ws && this.ws.readyState === 1){ this.ws.send(bytes); return true; } } catch(e){} return false; }
  feed(chunk){
    let b = chunk;
    if (this.buf.length){ b = new Uint8Array(this.buf.length + chunk.length); b.set(this.buf); b.set(chunk, this.buf.length); }
    let i = 0;
    while (b.length - i >= 2){
      let j = i + 1, len = 0, mult = 1, d;
      do { if (j >= b.length){ this.buf = b.slice(i); return; } d = b[j++]; len += (d & 127) * mult; mult *= 128; } while ((d & 128) && mult <= 2097152);
      if (b.length - j < len) break;
      this.handle(b[i] >> 4, b[i] & 15, b.subarray(j, j + len));
      i = j + len;
    }
    this.buf = b.slice(i);
  }
  handle(type, flags, body){
    if (type === 2){                                   // CONNACK
      if (body[1] !== 0){ try { this.ws.close(); } catch(e){} return; }
      this.up = true; this.tries = 0;
      for (const t of this.subs) this.sendSub(t);
      clearInterval(this.pingT); this.pingT = setInterval(() => this.raw(Uint8Array.of(0xc0, 0)), 25000);
      this.onChange();
    } else if (type === 3){                            // PUBLISH
      const tl = (body[0] << 8) | body[1], topic = MQ.td.decode(body.subarray(2, 2 + tl)), qos = (flags >> 1) & 3;
      let k = 2 + tl;
      if (qos){ if (qos === 1) this.raw(Uint8Array.of(0x40, 2, body[k], body[k + 1])); k += 2; }
      this.onMsg(topic, body.slice(k));
    }
  }
  subscribe(t){ if (!this.subs.includes(t)) this.subs.push(t); if (this.up) this.sendSub(t); }
  sendSub(t){ const p = this.pid = this.pid % 65535 + 1; this.raw(MQ.pack(0x82, Uint8Array.of(p >> 8, p & 255), MQ.str(t), Uint8Array.of(0))); }
  publish(topic, payload, droppable){
    if (!this.up || !this.ws) return false;
    if (droppable && this.ws.bufferedAmount > 262144) return false;   // falling behind: skip a table update, a newer one follows
    return this.raw(MQ.pack(0x30, MQ.str(topic), payload));
  }
}

/* ---- sealing: compress, then encrypt with a key made from the table code ---- */
async function tableKeys(code){
  const h = async s => new Uint8Array(await crypto.subtle.digest('SHA-256', MQ.te.encode(s)));
  const k = await h(`${ONLINE.room}|key|${code}`), t = await h(`${ONLINE.room}|topic|${code}`);
  return { key: await crypto.subtle.importKey('raw', k, 'AES-GCM', false, ['encrypt', 'decrypt']), base: ONLINE.room + '/' + [...t.slice(0, 12)].map(x => x.toString(16).padStart(2, '0')).join('') };
}
const squash = (bytes, S) => new Response(new Blob([bytes]).stream().pipeThrough(new S('deflate-raw'))).arrayBuffer().then(b => new Uint8Array(b));
async function seal(key, obj){
  let data = MQ.te.encode(JSON.stringify(obj)), z = 0;
  if (window.CompressionStream && data.length > 400){ try { data = await squash(data, CompressionStream); z = 1; } catch(e){} }
  const inner = new Uint8Array(data.length + 1); inner[0] = z; inner.set(data, 1);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, inner));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12);
  return out;
}
async function unseal(key, bytes){
  try {
    if (bytes.length < 30) return null;
    const inner = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.slice(0, 12) }, key, bytes.slice(12)));
    let data = inner.subarray(1);
    if (inner[0] === 1) data = await squash(data, DecompressionStream);
    return JSON.parse(MQ.td.decode(data));
  } catch(e){ return null; }
}

/* ---- the table's line: every relay at once, duplicates dropped ---- */
const MESH = {
  gen: 0, relays: [], key: null, base: '', seq: 0, seen: new Map(), q: Promise.resolve(), parting: null,
  count(){ return this.relays.filter(r => r.up).length; },
  // listen on <table>/<listen>; resolves true once at least one relay is connected
  async open(code, listen, onEnv){
    this.close();
    const gen = ++this.gen;
    let keys; try { keys = await tableKeys(code); } catch(e){ return false; }
    if (gen !== this.gen) return false;
    const topic = keys.base + '/' + listen, key = keys.key;
    Object.assign(this, { key, base: keys.base, seq: 0, seen: new Map(), q: Promise.resolve(), parting: null });
    this.relays = ONLINE.relays.map(url => {
      const r = new Relay(url, (t, bytes) => { if (gen === this.gen && t === topic) this.recv(key, bytes, onEnv, gen); }, () => { if (gen === this.gen) relayChanged(); });
      r.subscribe(topic);
      return r;
    });
    relayChanged();
    const t0 = Date.now();
    while (gen === this.gen && !this.count() && Date.now() - t0 < 12000) await sleep(150);
    return gen === this.gen && this.count() > 0;
  },
  async recv(key, bytes, onEnv, gen){
    const env = await unseal(key, bytes);
    if (gen !== this.gen || !env || typeof env !== 'object' || !env.m || typeof env.m !== 'object') return;
    const id = `${env.f}:${env.s}:${N0(env.n)}`;
    if (this.seen.has(id)) return;                     // the same message arriving through another relay
    this.seen.set(id, 1);
    if (this.seen.size > 3000){ let k = 0; for (const x of this.seen.keys()){ this.seen.delete(x); if (++k >= 1000) break; } }
    onEnv(env);
  },
  // dest 'h' = to the host, 'a' = to everyone at the table (`to` narrows it to one player)
  send(dest, m, to){
    if (!this.key) return;
    const rs = this.relays, key = this.key, topic = this.base + '/' + dest;
    const env = { f: NET.uid, s: NET.sess, n: ++this.seq, m }; if (to) env.to = to;
    this.q = this.q.then(() => seal(key, env)).then(b => { for (const r of rs) r.publish(topic, b, m.t === 'state'); }).catch(() => {});
  },
  // a goodbye sealed in advance, so it can go out even while the page is closing

// relay status, shown in the online sheets
let relayWasUp = 0;
function relayChanged(){
  const n = MESH.count(), total = ONLINE.relays.length;
  const el = $('#relayStat');
  if (el && MESH.relays.length) el.textContent = `Relay servers: ${n} of ${total} connected.`;
  if (['host', 'client'].includes(NET.role)){
    if (relayWasUp && !n) toast('Lost connection to all the relay servers. Trying again…');
    else if (!relayWasUp && n) toast('Connected again.');
  }
  relayWasUp = n;
}
// before hosting or joining: which relays can this device reach at all?
function probeRelays(){
  const el = $('#relayStat'); if (!el || MESH.relays.length) return;
  el.textContent = 'Checking the relay servers…';
  let ok = 0, done = 0;
  const total = ONLINE.relays.length;
  const fin = () => {
    const e = $('#relayStat'); if (!e || MESH.relays.length) return;
    if (done < total) e.textContent = `Checking the relay servers… ${ok} reachable so far.`;
    else e.textContent = ok ? `Relay servers: ${ok} of ${total} reachable from this device.` : 'None of the relay servers can be reached from this device. Check the internet connection, or try another network.';
  };
  for (const url of ONLINE.relays){
    let settled = false;
    const r = new Relay(url, () => {}, () => { if (!settled && r.up){ settled = true; ok++; done++; r.close(); fin(); } });
    setTimeout(() => { if (!settled){ settled = true; done++; r.close(); fin(); } }, 8000);
  }
}

const NET = {

  // ---- hosting ----
  to(uid, m){ MESH.send('a', m, uid); },

  async host(name){

  fromGuest(env){

  // ---- joining ----
  say(m){ MESH.send('h', m); },
  async join(code, name, onWait){

// is this online seat's player currently connected?
function netOff(p){ return NET.role === 'host' ? !NET.links[p.remote] : !!p.off; }
// say goodbye when the page closes, so the others find out straight away
window.addEventListener('pagehide', () => { if (NET.role) MESH.part(); });
// every 3 seconds: guests say hello, the host resends the table, and anyone silent for 20 seconds counts as gone
setInterval(() => {
  const now = Date.now();
  if (NET.role === 'host' || NET.role === 'lobby'){
    for (const uid in NET.links) if (now - NET.links[uid].seen > 20000) NET.dropLink(uid);
    if (now - NET.lastSend > 2500){ if (NET.role === 'lobby') NET.sendLobby(); else NET.flush(); }
  } else if (NET.role === 'joining' || NET.role === 'client'){
    NET.say({ t: 'hello', v: PROTO, name: NET.name });

    if (a && pd && pd.id === a.pid && pd.seat === NET.seat && now - a.at > 2500){ a.at = now; NET.say({ t: 'act', pid: a.pid, v: a.v }); }
    if (NET.heard && now - NET.heard > 20000 && !NET.lostShown){ NET.lostShown = true; toast('Lost touch with the host. Waiting for them to come back…'); }
  }

// the host double-checks every answer that arrives from another device
function checkAnswer(pd, v){
  const d = pd.data || {};
  switch (pd.kind){
    case 'turn': return v === 'keep' ? 'keep' : 'fish';
    case 'preRoll': return v === 'cut' && d.canCut ? 'cut' : 'roll';
    case 'throw': return 'throw';
    case 'spare': return !!v;
    case 'target': return (d.ids || []).includes(v) ? v : (d.ids || [])[0];
    case 'plankdum': return (d.opts || []).find(o => v && o.pid === v.pid && o.uid === v.uid) || (d.opts || [])[0];
    case 'crook': return v ? ((d.opts || []).find(o => o.pid === v.pid && o.uid === v.uid) || null) : null;
  }
  return v;
}
function snapOf(g){

    v: ++NET.snapV, code: NET.code, types: g.types, S: g.S,
    players: g.players.map(p => ({ name: p.name, human: p.human, remote: !!p.remote, off: !!(p.remote && !NET.links[p.remote]), status: p.status, boat: p.boat, tank: p.tank, items: p.items, note: p.note })),
    deckN: g.deck.length, discardN: g.discard.length, round: g.round, at: g.at, winner: g.winner ? g.winner.id : -1,

// only a few plain tags survive from the host's log text
function sanitize(html){
  const doc = new DOMParser().parseFromString(`<div>${html}</div>`, 'text/html'), out = document.createElement('div');
  (function walk(src, dst){
    for (const n of src.childNodes){
      if (n.nodeType === 3) dst.appendChild(document.createTextNode(n.textContent));
      else if (n.nodeType === 1){
        const tag = n.tagName.toLowerCase(); let el = null;
        if (tag === 'b' || tag === 'i') el = document.createElement(tag);
        else if (tag === 'span' && n.className === 'aiya'){ el = document.createElement('span'); el.className = 'aiya'; }
        if (el){ dst.appendChild(el); walk(n, el); } else walk(n, dst);
      }
    }
  })(doc.body.firstChild || doc.body, out);
  return out.innerHTML;
}
function cleanSnap(x){

    const cards = a => (Array.isArray(a) ? a : []).slice(0, 200).map(card).filter(Boolean);
    const sx = x.S || {}, S = Object.assign({}, DEFAULT_SETTINGS, { winPoints: clamp(sx.winPoints, 5, 500, 40), speed: CFG.S.speed });
    for (const [k, ok] of [['slipperyFail', ['pass', 'away']], ['crookTo', ['boat', 'tank']], ['crookFail', ['capsize', 'safe']], ['hungryEats', ['random', 'biggest', 'smallest']], ['spareReroll', ['one', 'all']]]) if (ok.includes(sx[k])) S[k] = sx[k];

      note: p.note ? { id: N0(p.note.id), delta: N0(p.note.delta), why: String(p.note.why || '').slice(0, 80) } : null }));

        zone: L.zone ? { from: N0(L.zone.from, 21), b: N0(L.zone.b) } : null,

      if (d.t) data.t = normType(d.t);
      if (Array.isArray(d.ids)) data.ids = d.ids.map(v => N0(v, -1)).filter(v => v >= 0 && v < n);
      if (Array.isArray(d.opts)) data.opts = d.opts.map(o => ({ pid: N0(o && o.pid, -1), uid: N0(o && o.uid, -1) })).filter(o => o.pid >= 0 && o.pid < n);
      pend = { id: +x.pend.id, seat: clamp(x.pend.seat, 0, n - 1, 0), kind: x.pend.kind, data };
    }
    const fx = (Array.isArray(x.fx) ? x.fx : []).slice(-16).map(f => ({ id: N0(f.id), name: String(f.name || '').slice(0, 20), d: { pid: clamp(f.d && f.d.pid, 0, n - 1, 0), n: N0(f.d && f.d.n), ok: !!(f.d && f.d.ok), nat: N0(f.d && f.d.nat), dur: Math.min(3, N0(f.d && f.d.dur, .6)), item: !!(f.d && f.d.item) } }));
    return { code: String(x.code || ''), types, S, players, deckN: N0(x.deckN), discardN: N0(x.discardN), round: N0(x.round), at: clamp(x.at, -1, n - 1, -1), winner: clamp(x.winner, -1, n - 1, -1), line, story, logs: lines(x.logs), pend, pendSeat: clamp(x.pendSeat, -1, n - 1, -1), fx };
  } catch(e){ return null; }
}

function viewOf(x){

    seats = CFG.seats.map((x, i) => ({ name: x.name || `Player ${i + 1}`, human: x.type === 'human', you: x.type === 'human' && humans === 1, nerve: 5 + Math.floor(Math.random() * 7) }));

function deckCode(deck, S){

    <p class="lede">Changes are saved in this browser when you press <b>Save and start new game</b>.</p>
    <h3>Cards <span class="ed-sum" id="edSum">${edSum()}</span></h3>
    <p>Rolls: how many d20 rolls you get. Need: the number to hit. Bonus: added to every roll while the card is in your boat or item zone. Raw: bonuses don’t count. Leave card text blank to use the rule’s default wording.</p>
    <div class="tbl-wrap"><table class="ed deck"><thead><tr><th>Name</th><th>How many</th><th>Type</th><th>Rolls</th><th>Need</th><th>Pts</th><th>Bonus</th><th>Raw</th><th>Special rule</th><th>Card text</th><th></th></tr></thead>
    <tbody id="edBody">${ED.deck.map(edRow).join('')}</tbody></table></div>
    <div class="row-btns"><button class="btn sm" data-cmd="addFish">+ Add a fish</button><button class="btn sm" data-cmd="addItem">+ Add an item</button></div>

    <h3>House rules</h3>
    <div class="hr-grid" id="edRules">
      <label class="field" for="hr-winPoints"><span>Points to win</span><input id="hr-winPoints" data-s="winPoints" type="number" min="5" max="500" value="${S.winPoints}"></label>
      ${SEL('hr-bots', 'Bots in test games', [1,2,3,4,5].map(n => [n, n + (n > 1 ? ' bots' : ' bot')]), S.bots)}
      ${SEL('hr-slipperyFail', 'Slippery Fish, on a miss', [['pass', 'next player must roll for it'], ['away', 'discarded']], S.slipperyFail)}
      ${SEL('hr-crookTo', 'Hired Crook catch goes to', [['boat', 'your boat'], ['tank', 'your tank']], S.crookTo)}
      ${SEL('hr-crookFail', 'Hired Crook miss', [['capsize', 'you capsize'], ['safe', 'nothing happens']], S.crookFail)}
      ${SEL('hr-hungryEats', 'Hungry Fish eats', [['random', 'a random fish'], ['biggest', 'your highest-point fish'], ['smallest', 'your lowest-point fish']], S.hungryEats)}
      ${SEL('hr-spareReroll', 'Spare Line gives', [['one', 'one extra roll'], ['all', 'a redo of all your rolls']], S.spareReroll)}
    </div>

    <h3>Test with bots</h3>
    <p>Bots play 100 games with these cards and rules. Shows game length and how often each fish is caught.</p>
    <div class="row-btns"><button class="btn sm" data-cmd="sim">Run 100 bot games</button></div>
    <div id="simOut"></div>

    <h3>Deck code</h3>
    <p>Copy this to save a version or share it. Paste a code in and press Load to use it. You can also paste it to Claude to make it the default deck.</p>
    <textarea class="code" id="edCode" spellcheck="false" aria-label="Deck code">${esc(deckCode(ED.deck, ED.S))}</textarea>
    <div class="row-btns"><button class="btn sm" data-cmd="copyCode">Copy</button><button class="btn sm" data-cmd="loadCode">Load pasted code</button></div>
    <p class="msg" id="edMsg" role="status"></p>

    <div class="sheet-f"><button class="btn" data-cmd="resetDeck">Reset to original</button><button class="btn keep" data-cmd="saveDeck">Save and start new game</button></div>`;
}
function openTackle(){
  if (!ED.deck){ ED.deck = clone(CFG.deck); ED.S = clone(CFG.S); }
  openSheet(tackleHTML(), 'wide');
}
function refreshTackle(){ const y = $('#overlay').scrollTop; $('#sheet').innerHTML = tackleHTML(); $('#overlay').scrollTop = y; }
function edMsg(t){ const m = $('#edMsg'); if (m) m.textContent = t; }
function refreshCode(){ const c = $('#edCode'); if (c && document.activeElement !== c) c.value = deckCode(ED.deck, ED.S); }

function onEdit(e){
  const el = e.target;
  const tr = el.closest && el.closest('#edBody tr');
  if (tr && el.dataset.f){
    const i = +tr.dataset.i, f = el.dataset.f, row = ED.deck[i]; if (!row) return;
    if (el.type === 'checkbox') row[f] = el.checked;
    else if (el.type === 'number') row[f] = el.value === '' ? 0 : Number(el.value);
    else row[f] = el.value;
    if (e.type === 'change' && (f === 'kind' || f === 'rule')){
      if (f === 'kind'){ row.rule = row.kind === 'item' ? 'blank' : ''; if (row.kind === 'fish'){ row.rolls = row.rolls || 1; row.target = row.target || 10; row.points = row.points || 1; } }
      if (f === 'rule'){ row.kind = RULES[row.rule] ? RULES[row.rule].kind : row.kind; if (row.rule === 'rod' && !row.bonus) row.bonus = 1; }
      const n = toEl(`<table><tbody>${edRow(row, i)}</tbody></table>`).querySelector('tr'); tr.replaceWith(n);
    }
    const s = $('#edSum'); if (s) s.textContent = edSum();
    refreshCode();
    return;
  }
  if (el.dataset && el.dataset.s && ED.S && el.closest('#edRules')){
    const k = el.dataset.s; ED.S[k] = el.type === 'number' || k === 'bots' ? Number(el.value) : el.value;
    refreshCode();
  }
}
document.addEventListener('input', onEdit);
document.addEventListener('change', onEdit);

async function runSim(){
  const out = $('#simOut'); if (!out) return;
  const types = ED.deck.map(normType);
  if (!types.some(t => t.count > 0)){ out.innerHTML = '<p class="msg">The deck is empty. Add some cards first.</p>'; return; }
  out.innerHTML = '<p>Running…</p>';
  await sleep(30);
  const S = Object.assign({}, ED.S, { winPoints: clamp(ED.S.winPoints, 5, 500, 40) });
  const n = clamp(S.bots, 1, 5, 3) + 1, games = 100;
  const st = { games: 0, roundList: [], turns: 0, capsizes: 0, keeps: 0, winPts: 0, cards: {} };
  for (let i = 0; i < games; i++){
    const seats = Array.from({ length: n }, (_, k) => ({ name: 'Bot ' + (k + 1), nerve: 5 + Math.floor(Math.random() * 7) }));
    await new Game({ types, S, seats, stats: st }).run();
    if (i % 10 === 9) await sleep(0);
  }
  const R = st.roundList, rounds = R.reduce((a, b) => a + b, 0);
  const rows = types.map((t, i) => ({ t, s: st.cards[i] || { drawn: 0, caught: 0, missed: 0, cut: 0 } })).filter(x => x.t.count > 0)
    .map(({ t, s }) => { const tries = s.caught + s.missed, rate = tries ? s.caught / tries : 0;
      return `<tr class="${t.kind}"><td><b>${esc(t.name)}</b></td><td>${s.drawn}</td><td>${t.kind === 'fish' ? s.caught : ''}</td><td>${t.kind === 'fish' ? s.missed : ''}</td><td>${t.kind === 'fish' ? s.cut : ''}</td><td>${t.kind === 'fish' && tries ? `<span class="rate"><i style="width:${rate * 100}%"></i></span>${pct(rate)}` : ''}</td></tr>`; }).join('');
  out.innerHTML = `<p class="sim-sum">${games} games, ${n} bots each: <b>${(rounds / games).toFixed(1)}</b> rounds per game on average (shortest ${Math.min(...R)}, longest ${Math.max(...R)}). Winning score averaged <b>${Math.round(st.winPts / games)}</b>. A player capsized in <b>${pct(st.capsizes / (rounds * n))}</b> of rounds.</p>
    <div class="tbl-wrap"><table class="ed"><thead><tr><th>Card</th><th>Drawn</th><th>Caught</th><th>Missed</th><th>Scissored</th><th>Catch rate</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p style="color:var(--ink-soft)">Bots keep once their boat reaches a random 5–11 pts, use Scissors on fish under 30%, and always use Spare Lines. Catch and miss counts include passed Slippery Fish and Jokers; Hired Crook rolls aren't counted.</p>`;
}

/* ════════════════════════════ commands & input ════════════════════════════ */
const CMD = {
  rules(){ openSheet(rulesHTML(), 'wide'); },
  tackle(){ if (NET.role === 'client'){ toast('This table uses the host’s deck. Leave the table to edit your own.'); return; } openTackle(); },
  newgameSheet(){ NG.seats = clone(CFG.seats); openSheet(newGameHTML()); },
  startNew(){
    const seats = (NG.seats || CFG.seats).map((x, i) => ({ name: cleanName(x.name || `Player ${i + 1}`), type: x.type === 'human' ? 'human' : 'bot' }));
    if (seats.length < 2){ $('#ngMsg').textContent = 'You need at least two players.'; return; }
    CFG.seats = seats.slice(0, 6); store.set('fishqueen.seats', CFG.seats); NG.seats = null;
    CFG.S.winPoints = clamp($('#ng-win').value, 5, 500, 40);
    CFG.S.speed = $('#ng-speed').value;
    saveCFG(); closeSheet(); newGame();
  },
  seatAdd(b){
    if (NG.seats.length >= 6) return;
    const type = b.dataset.type;
    NG.seats.push({ type, name: type === 'bot' ? unusedBotName() : `Player ${NG.seats.length + 1}` });
    refreshNG();
  },
  seatDel(b){ if (NG.seats.length > 2){ NG.seats.splice(+b.dataset.i, 1); refreshNG(); } },
  online(){ openSheet(onlineHTML()); probeRelays(); },
  async hostTable(){
    const name = cleanName($('#on-host-name').value || 'Host');
    const btn = $('[data-cmd="hostTable"]'), say = t => { const m = $('#hostMsg'); if (m) m.textContent = t; };
    if (btn) btn.disabled = true; say('Creating a table…');
    const msg = await NET.host(name);
    if (msg){ say(msg); if (btn) btn.disabled = false; return; }
    if (NET.role === 'lobby'){ openSheet(lobbyHostHTML()); renderLobby(); }
  },
  async joinTable(){
    const code = $('#on-code').value, name = cleanName($('#on-join-name').value || 'Player');
    const btn = $('[data-cmd="joinTable"]'), say = t => { const m = $('#joinMsg'); if (m) m.textContent = t; };
    if (btn) btn.disabled = true; say('Connecting…');
    const msg = await NET.join(code, name, say);
    if (msg){ say(msg); if (btn) btn.disabled = false; return; }
    if (NET.role === 'joining'){ openSheet(joinWaitHTML()); renderLobby(); }
  },
  startOnline(){ NET.startHosted({ bots: +$('#on-bots').value || 0, winPoints: $('#on-win').value }); },
  copyInvite(){
    const txt = `Come and play the Apocalyptic Fish Game: open ${siteLink()} then press Play online and join table ${NET.code}.`;
    try { navigator.clipboard.writeText(txt).then(() => toast('Invite copied. Paste it to the others.'), () => toast(txt)); } catch(e){ toast(txt); }
  },
  leaveOnline(){ NET.leave(); closeSheet(); newGame(); },
  botTakeover(){ NET.botTakeover(); },
  close(){ closeSheet(); },
  frontPlay(){ newGame(); },
  again(){ closeSheet(); if (NET.role === 'client') NET.leave(); newGame(); },
  addFish(){ ED.deck.push({ name: 'NEW FISH', count: 4, kind: 'fish', rolls: 1, target: 8, points: 2, bonus: 0, raw: false, rule: '', text: '' }); refreshTackle(); const i = ED.deck.length - 1; const el = $(`#ed-${i}-name`); if (el){ el.focus(); el.select(); } },
  addItem(){ ED.deck.push({ name: 'NEW ITEM', count: 2, kind: 'item', rolls: 0, target: 0, points: 0, bonus: 0, raw: false, rule: 'blank', text: '' }); refreshTackle(); const i = ED.deck.length - 1; const el = $(`#ed-${i}-name`); if (el){ el.focus(); el.select(); } },
  delRow(b){ ED.deck.splice(+b.dataset.i, 1); refreshTackle(); },
  resetDeck(){ ED.deck = clone(DEFAULT_DECK.map(normType)); ED.S = Object.assign({}, DEFAULT_SETTINGS, { speed: CFG.S.speed }); refreshTackle(); edMsg('Original cards and rules restored. Press Save and start new game to use them.'); },
  saveDeck(){
    const deck = ED.deck.map(normType);
    if (!deck.some(t => t.count > 0)){ edMsg('The deck needs at least one card.'); return; }
    CFG.deck = deck;
    CFG.S = Object.assign({}, CFG.S, ED.S, { winPoints: clamp(ED.S.winPoints, 5, 500, 40), bots: clamp(ED.S.bots, 1, 5, 3) });
    saveCFG(); ED.deck = null; ED.S = null; closeSheet(); newGame();
  },
  copyCode(){
    const c = $('#edCode'); const txt = deckCode(ED.deck, ED.S); c.value = txt;
    const fallback = () => { c.focus(); c.select(); edMsg('Selected. Press Ctrl/Cmd+C to copy.'); };
    try { navigator.clipboard.writeText(txt).then(() => edMsg('Copied.'), fallback); } catch(e){ fallback(); }
  },
  loadCode(){
    try {
      const o = JSON.parse($('#edCode').value);
      const deck = Array.isArray(o) ? o : o.deck;
      if (!Array.isArray(deck) || !deck.length) throw new Error('no deck');
      ED.deck = deck.map(normType);
      if (o.rules && typeof o.rules === 'object') ED.S = Object.assign({}, ED.S, o.rules);
      refreshTackle(); edMsg(`Loaded ${ED.deck.length} card types. Press Save and start new game to use them.`);
    } catch(e){ edMsg("Couldn't read that code. It should be in the same format as the code this box started with."); }
  },
  sim(){ runSim(); },
  log(){ openSheet(`<div class="log-sheet"><div class="sheet-h"><h2>Log</h2>${closeBtn}</div><ol class="log">${$('#log').innerHTML}</ol><div class="sheet-f"><button class="btn keep" data-cmd="close">Close</button></div></div>`); },
  sound(){ SFX.on = !SFX.on; store.set('fishqueen.sound', SFX.on); updateSoundBtn(); if (SFX.on){ SFX.init(); setTimeout(() => SFX.play('ui'), 30); } },
};

document.addEventListener('click', e => {
  const a = e.target.closest('[data-a]');
  if (a && a.classList.contains('throw')){
    // pointer presses are handled by hold-to-shake; Enter/Space gives a quick throw
    if (e.detail === 0 && UI.pending && !THROW.active){ startShake(a); setTimeout(releaseShake, 380); }
    return;
  }
  if (e.target.closest('.btn')) SFX.play('ui');
  if (a && UI.pending && a.closest('#prompt')){
    const pd = UI.pending, v = a.dataset.a;
    switch (pd.kind){
      case 'turn': if (v === 'fish' || v === 'keep') UI.answer(v); break;
      case 'preRoll': if (v === 'roll' || v === 'cut') UI.answer(v); break;
      case 'spare': UI.answer(v === 'yes'); break;
      case 'target': if (v.startsWith('t:')) UI.answer(Number(v.slice(2))); break;
      case 'plankdum': if (v.startsWith('p:')){ const [, pid, uid] = v.split(':'); UI.answer({ pid: +pid, uid: +uid }); } break;
      case 'crook': if (v === 'none') UI.answer(null); else if (v.startsWith('c:')){ const [, pid, uid] = v.split(':'); UI.answer({ pid: +pid, uid: +uid }); } break;
    }
    return;
  }
  const c = e.target.closest('[data-cmd]');
  if (c && CMD[c.dataset.cmd]) CMD[c.dataset.cmd](c);
});
$('#overlay').addEventListener('mousedown', e => { if (e.target === e.currentTarget && !$('#edBody')) closeSheet(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#overlay').hidden){ closeSheet(); return; }
  if (!$('#overlay').hidden || e.metaKey || e.ctrlKey || e.altKey || (e.target.closest && e.target.closest('input,textarea,select'))) return;
  const key = e.key.toLowerCase();
  if ((key === 'r' || key === 'y') && UI.pending){
    const tb = $('#prompt .throw'); if (tb && (key === 'r' || tb.dataset.a === 'yes')){ e.preventDefault(); if (!e.repeat) startShake(tb); return; }
  }
  const map = { f: 'fish', k: 'keep', c: 'cut', n: 'no' };
  const a = map[key]; if (!a || !UI.pending) return;
  const b = $(`#prompt [data-a="${a}"]`); if (b){ e.preventDefault(); b.click(); }
});
document.addEventListener('keyup', e => { const key = e.key.toLowerCase(); if ((key === 'r' || key === 'y') && THROW.active) releaseShake(); });
$('#speedSel').addEventListener('change', e => { CFG.S.speed = e.target.value; if (UI.game) UI.game.S.speed = e.target.value; saveCFG(); });

updateSoundBtn();
(() => { let back = null; try { back = sessionStorage.getItem('fishqueen.table'); } catch(e){} if (back) newGame(); else showFront(); })();
</script>
